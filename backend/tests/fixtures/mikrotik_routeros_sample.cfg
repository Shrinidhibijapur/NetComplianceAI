# RouterOS 7.4.1
# model = RB4011iGS+RM
# serial-number = ABCD1234EFGH
/system identity set name=mikrotik-gw-01
/ip ssh set strong-crypto=yes
/ip service set telnet disabled=yes
/ip service set www disabled=yes
/ip service set www-ssl disabled=no
/system ntp client set enabled=yes primary-ntp=10.0.0.2
/system logging add action=remote topics=critical
/snmp community set [ find default=yes ] name=NetSecureComm
/ip firewall filter add action=drop chain=input comment="default deny"
/radius add address=10.0.0.5 secret=RadiusSecret service=login
