! Arista EOS running-config — hardened sample for Phase 2 golden tests
! model: DCS-7050CX3-32S
! serial number: JPE12345678
! EOS version 4.29.2F
hostname arista-spine-01
ip ssh version 2
aaa authentication login default local
service password-encryption
no cdp run
ntp server 10.0.0.2
logging host 10.0.0.1
management api http-commands
   no shutdown
!
interface Ethernet1
   no shutdown
!
line vty 0 7
   transport input ssh
   idle-timeout 5
!
snmp-server community CustomROonly RO
deny ip any any
