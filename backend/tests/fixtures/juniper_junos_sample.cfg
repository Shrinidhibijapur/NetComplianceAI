## Juniper JunOS running-config — sample for Phase 1/2/3 tests
set system services ssh
set system services web-management http
set system syslog host 10.0.0.1 any any
set system ntp server 10.0.0.2
set firewall filter DENY_ALL term default then discard
set snmp community public authorization read-only
set unknown-vendor-knob unknown-knob enable
