#config-version=FGT60F-6.4.8-FW-build2539-210721:opmode=1:vdom=0:user=admin
#conf_file_ver=100000001 serial=FGT60F1234567890 model=FGT60F
config system global
    set hostname fortinet-fw-01
    set admintimeout 10
    set admin-telnet disable
    set admin-sport 10443
end
config system ntp
    set ntpsync enable
    set server 10.0.0.2
end
config log syslogd setting
    set status enable
    set server 10.0.0.1
end
config system snmp community
    edit 1
        set name NetOpsSecure
    next
end
config system password-policy
    set status enable
    set min-length 12
end
