# DISA Cisco IOS Router NDM STIG (v2r4) Mappings
# Rule Schema V2 - Verified DISA STIG Vuln IDs from DISA Cyber Exchange

- rule_id: STIG-V-205663
  title: Router must use SSHv2 for administrative access
  target_field: ssh_version
  operator: equals
  expected: "2"
  severity: high
  framework: STIG
  framework_reference: DISA STIG Rule SV-205663r1_rule / Vuln ID V-205663
  source: DISA Cisco IOS Router NDM STIG v2r4
  source_url: https://public.cyber.mil/stigs/
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "ip ssh version 2", verified: true }
    juniper_junos: { command: "set system services ssh protocol-version v2", verified: true }

- rule_id: STIG-V-205664
  title: Router must not enable Telnet for remote administration
  target_field: telnet_enabled
  operator: equals
  expected: false
  severity: high
  framework: STIG
  framework_reference: DISA STIG Rule SV-205664r1_rule / Vuln ID V-205664
  source: DISA Cisco IOS Router NDM STIG v2r4
  source_url: https://public.cyber.mil/stigs/
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "line vty 0 4\n transport input ssh", verified: true }
    juniper_junos: { command: "delete system services telnet", verified: true }

