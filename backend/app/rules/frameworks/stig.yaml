# DISA STIG-style control mappings, against the same canonical control vocabulary
# as CIS/NIST (docs/Implementation_Plan.md Section 3/5).
- control_id: STIG-V-220619
  framework: STIG
  title: The network device must use SSH protocol version 2 for management
  canonical_key: ssh_version
  expected: "2"
  severity: high
  remediation:
    cisco_ios: "ip ssh version 2"
    juniper_junos: "set system services ssh"

- control_id: STIG-V-220620
  framework: STIG
  title: The network device must not use Telnet for management
  canonical_key: telnet_enabled
  expected: false
  severity: high
  remediation:
    cisco_ios: "line vty 0 4\n transport input ssh"
    juniper_junos: "delete system services telnet"

- control_id: STIG-V-220621
  framework: STIG
  title: The network device must not use unencrypted HTTP for management
  canonical_key: http_mgmt_enabled
  expected: false
  severity: medium
  remediation:
    cisco_ios: "no ip http server"
    juniper_junos: "delete system services web-management http"

- control_id: STIG-V-220622
  framework: STIG
  title: The network device must encrypt locally stored passwords
  canonical_key: password_encryption
  expected: "type7"
  severity: medium
  remediation:
    cisco_ios: "service password-encryption"
    juniper_junos: "set system login password format sha512"

- control_id: STIG-V-220623
  framework: STIG
  title: The network device must log all administrative access attempts
  canonical_key: logging_enabled
  expected: true
  severity: medium
  remediation:
    cisco_ios: "logging host <syslog-server-ip>"
    juniper_junos: "set system syslog host <syslog-server-ip> any any"

- control_id: STIG-V-220624
  framework: STIG
  title: The network device must synchronize time with an authoritative source
  canonical_key: ntp_configured
  expected: true
  severity: low
  remediation:
    cisco_ios: "ntp server <ntp-server-ip>"
    juniper_junos: "set system ntp server <ntp-server-ip>"

- control_id: STIG-V-220625
  framework: STIG
  title: The network device must deny traffic by default at the boundary
  canonical_key: acl_default_deny
  expected: true
  severity: high
  remediation:
    cisco_ios: "access-list 101 deny ip any any"
    juniper_junos: "set firewall filter PROTECT term deny-all then discard"

- control_id: STIG-V-220626
  framework: STIG
  title: The network device must not use default SNMP community strings
  canonical_key: snmp_community_default
  expected: false
  severity: high
  remediation:
    cisco_ios: "no snmp-server community public\nno snmp-server community private"
    juniper_junos: "delete snmp community public"
