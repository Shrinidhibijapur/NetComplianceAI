# NIST SP 800-53 Rev 5 Control Catalog (OSCAL Mappings)
# Rule Schema V2 - Data-driven multi-framework rule definition

- rule_id: NIST-AC-17(2)
  title: Cryptographically Protected Remote Access Sessions (SSHv2)
  target_field: ssh_version
  operator: equals
  expected: "2"
  severity: high
  framework: NIST
  framework_reference: NIST SP 800-53 Rev 5 AC-17(2)
  source: NIST SP 800-53 Rev 5 OSCAL Control Catalog
  source_url: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "ip ssh version 2", verified: true }
    juniper_junos: { command: "set system services ssh protocol-version v2", verified: true }

- rule_id: NIST-AC-17(1)
  title: Prohibit Unencrypted Remote Management Protocols (Telnet)
  target_field: telnet_enabled
  operator: equals
  expected: false
  severity: high
  framework: NIST
  framework_reference: NIST SP 800-53 Rev 5 AC-17(1)
  source: NIST SP 800-53 Rev 5 OSCAL Control Catalog
  source_url: https://csrc.nist.gov/publications/detail/sp/800-53/rev-5/final
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "line vty 0 4\n transport input ssh", verified: true }
    juniper_junos: { command: "delete system services telnet", verified: true }

