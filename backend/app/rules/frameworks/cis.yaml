# CIS Benchmark controls for Network Devices
# Rule Schema V2 - Data-driven multi-framework rule definition

- rule_id: CIS-5.2.1
  title: Use SSHv2 for remote management
  target_field: ssh_version
  operator: equals
  expected: "2"
  severity: high
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 5.2.1
  source: CIS Cisco IOS Security Benchmark v4.0.0
  source_url: https://www.cisecurity.org/cis-benchmarks
  verified: true
  vendors: ["cisco_ios", "juniper_junos", "arista_eos", "fortinet_fortios", "mikrotik_routeros", "sonic"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "ip ssh version 2", verified: true }
    juniper_junos: { command: "set system services ssh protocol-version v2", verified: true }

- rule_id: CIS-9.2.1
  title: Disable Telnet for remote management
  target_field: telnet_enabled
  operator: equals
  expected: false
  severity: high
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 9.2.1
  source: CIS Cisco IOS Security Benchmark v4.0.0
  source_url: https://www.cisecurity.org/cis-benchmarks
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "line vty 0 4\n transport input ssh", verified: true }
    juniper_junos: { command: "delete system services telnet", verified: true }

- rule_id: CIS-9.2.2
  title: Disable HTTP management interface
  target_field: http_mgmt_enabled
  operator: equals
  expected: false
  severity: medium
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 9.2.2
