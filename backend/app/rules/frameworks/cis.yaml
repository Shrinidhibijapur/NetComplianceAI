- rule_id: CIS-3.1.1
  title: Default-deny ACLs at network boundary
  target_field: acl_default_deny
  operator: equals
  expected: true
  severity: high
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 3.1.1
  source: CIS Cisco IOS Security Benchmark v4.0.0
  source_url: https://www.cisecurity.org/cis-benchmarks
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "access-list 101 deny ip any any", verified: true }
    juniper_junos: { command: "set firewall filter PROTECT term deny-all then discard", verified: true }

- rule_id: CIS-9.3.1
  title: No default SNMP community strings
  target_field: snmp_community_default
  operator: equals
  expected: false
  severity: high
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 9.3.1
  source: CIS Cisco IOS Security Benchmark v4.0.0
  source_url: https://www.cisecurity.org/cis-benchmarks
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "no snmp-server community public\nno snmp-server community private", verified: true }
    juniper_junos: { command: "delete snmp community public", verified: true }

