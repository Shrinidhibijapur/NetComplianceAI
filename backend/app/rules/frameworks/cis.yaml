  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "no ip http server", verified: true }
    juniper_junos: { command: "delete system services web-management http", verified: true }

- rule_id: CIS-4.1.1
  title: Enable password encryption for locally stored credentials
  target_field: password_encryption
  operator: in
  expected: ["type7", "sha512", "secret", "true"]
  severity: medium
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 4.1.1
  source: CIS Cisco IOS Security Benchmark v4.0.0
  source_url: https://www.cisecurity.org/cis-benchmarks
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "service password-encryption", verified: true }
    juniper_junos: { command: "set system login password format sha512", verified: true }

- rule_id: CIS-8.1.1
  title: Enable logging of administrative access
  target_field: logging_enabled
  operator: equals
  expected: true
  severity: medium
  framework: CIS
  framework_reference: CIS Cisco IOS Benchmark v4.0.0 Section 8.1.1
  source: CIS Cisco IOS Security Benchmark v4.0.0
  source_url: https://www.cisecurity.org/cis-benchmarks
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "logging host <syslog-server-ip>", verified: true }
    juniper_junos: { command: "set system syslog host <syslog-server-ip> any any", verified: true }

