# CIS Benchmark controls, mapped to the canonical control vocabulary from
# NormalizedConfig.controls (see docs/Implementation_Plan.md Section 3/5).
- control_id: CIS-5.2.1
  framework: CIS
  title: Use SSHv2 for remote management
  canonical_key: ssh_version
  expected: "2"
  severity: high
  remediation:
    cisco_ios: "ip ssh version 2"
    juniper_junos: "set system services ssh"

- control_id: CIS-9.2.1
  framework: CIS
  title: Disable Telnet for remote management
  canonical_key: telnet_enabled
  expected: false
  severity: high
  remediation:
    cisco_ios: "line vty 0 4\n transport input ssh"
    juniper_junos: "delete system services telnet"

- control_id: CIS-9.2.2
  framework: CIS
  title: Disable HTTP management interface
  canonical_key: http_mgmt_enabled
  expected: false
  severity: medium
  remediation:
    cisco_ios: "no ip http server"
    juniper_junos: "delete system services web-management http"

- control_id: CIS-4.1.1
  framework: CIS
  title: Enable password encryption for locally stored credentials
  canonical_key: password_encryption
  expected: "type7"
  severity: medium
  remediation:
    cisco_ios: "service password-encryption"
    juniper_junos: "set system login password format sha512"

- control_id: CIS-8.1.1
  framework: CIS
  title: Enable logging of administrative access
  canonical_key: logging_enabled
  expected: true
  severity: medium
  remediation:
    cisco_ios: "logging host <syslog-server-ip>"
    juniper_junos: "set system syslog host <syslog-server-ip> any any"

- control_id: CIS-2.1.1
  framework: CIS
  title: Configure NTP for accurate audit timestamps
  canonical_key: ntp_configured
  expected: true
  severity: low
  remediation:
    cisco_ios: "ntp server <ntp-server-ip>"
    juniper_junos: "set system ntp server <ntp-server-ip>"

- control_id: CIS-3.1.1
  framework: CIS
  title: Default-deny ACLs at network boundary
  canonical_key: acl_default_deny
  expected: true
  severity: high
  remediation:
    cisco_ios: "access-list 101 deny ip any any"
    juniper_junos: "set firewall filter PROTECT term deny-all then discard"

- control_id: CIS-9.3.1
  framework: CIS
  title: No default SNMP community strings
  canonical_key: snmp_community_default
  expected: false
  severity: high
  remediation:
    cisco_ios: "no snmp-server community public\nno snmp-server community private"
    juniper_junos: "delete snmp community public"
