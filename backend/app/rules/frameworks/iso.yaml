# ISO/IEC 27001:2022 Annex A Controls
# Rule Schema V2 - Data-driven multi-framework rule definition
# Explicit Category B: Technical Implementation Mappings of Annex A Controls

- rule_id: ISO-A.8.20.1
  title: Network Controls - Secure SSH Remote Administration
  target_field: ssh_version
  operator: equals
  expected: "2"
  severity: high
  framework: ISO
  framework_reference: ISO/IEC 27001:2022 Control A.8.20
  mapping_type: technical_implementation_mapping
  source: ISO/IEC 27001:2022 Information Security Controls
  source_url: https://www.iso.org/standard/27001
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "ip ssh version 2", verified: true }
    juniper_junos: { command: "set system services ssh protocol-version v2", verified: true }

- rule_id: ISO-A.8.20.2
  title: Network Controls - Prohibit Unencrypted Telnet Service
  target_field: telnet_enabled
  operator: equals
  expected: false
  severity: high
  framework: ISO
  framework_reference: ISO/IEC 27001:2022 Control A.8.20
  mapping_type: technical_implementation_mapping
  source: ISO/IEC 27001:2022 Information Security Controls
  source_url: https://www.iso.org/standard/27001
  verified: true
  vendors: ["*"]
  platforms: ["*"]
  remediation:
    cisco_ios: { command: "line vty 0 4\n transport input ssh", verified: true }
    juniper_junos: { command: "delete system services telnet", verified: true }

