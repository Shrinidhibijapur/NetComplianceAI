name: Deploy to EC2

on:
  push:
    branches:
      - main          # auto-deploy only on pushes to main

jobs:
  # ── Deploy to EC2 ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy Backend to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}        # your EC2 public IP
          username: ${{ secrets.EC2_USER }}    # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}      # contents of your .pem file
          port: 22
          script: |
            set -e

            echo "📦 Pulling latest code..."
            cd ~/NetComplianceAI
            git pull origin main

            echo "🐳 Rebuilding and restarting containers..."
            docker compose up --build -d

            echo "⏳ Waiting for backend to be healthy..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "✅ Backend is healthy after ${i} attempt(s)!"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "❌ Backend health check timed out. Showing container logs:"
                docker compose logs --tail=100 backend
                exit 1
              fi
              echo "Waiting for backend startup... ($i/30)"
              sleep 3
            done

            echo "🚀 Deployment complete!"
