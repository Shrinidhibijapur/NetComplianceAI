services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: complianceai
      POSTGRES_PASSWORD: complianceai
      POSTGRES_DB: complianceai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceai -d complianceai"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:

