services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: complianceai
      POSTGRES_PASSWORD: complianceai
      POSTGRES_DB: complianceai
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
